---
# Local hooks run tools from the reproducible uv environment. Install uv first,
# then run `uv sync --all-groups` and install hooks with `uv run pre-commit`.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        stages: [pre-commit]

      - id: isort
        name: isort
        entry: uv run isort --profile black
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pylint
        name: pylint
        entry: uv run pylint --disable=R0801
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      - id: yamllint
        name: yamllint
        entry: uv run yamllint
        language: system
        types: [yaml]
        stages: [pre-commit]

      - id: commitizen-local
        name: commitizen
        entry: uv run cz check --commit-msg-file
        language: system
        pass_filenames: true
        stages: [commit-msg]
