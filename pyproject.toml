[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "eeca-python-template"
version = "0.1.0"
description = "Template repository for Python projects with pre-configured quality, test, security, and release foundations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EECA", email = "DataAndAnalytics@eeca.govt.nz" }]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.32.4,<3",
    "urllib3>=2.6,<3",
]

[project.urls]
Repository = "https://github.com/EECA-NZ/eeca-python-template"

[dependency-groups]
dev = [
    "black>=26.5.1,<27",
    "build>=1.4,<2",
    "commitizen>=4.18,<5",
    "coverage>=7.12,<8",
    "isort>=8.0.1,<9",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.6,<5",
    "pylint>=4.0.8,<5",
    "pytest>=9.1.1,<10",
    "yamllint>=1.37,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pylint.main]
py-version = "3.11"
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 88

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
