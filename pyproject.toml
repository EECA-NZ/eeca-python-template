[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeca_python_template"
version = "0.1.0"
description = "Template repository for Python projects with pre-configured GitHub Actions for linting and testing."
authors = [{ name = "EECA", email = "DataAndAnalytics@eeca.govt.nz" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.33.0,<2.34.0",
    "urllib3>=2.6.0,<3.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"

[tool.pytest.ini_options]
pythonpath = ["src"]
